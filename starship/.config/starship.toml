# ~/.config/starship.toml — minimal starship prompt
format = '$directory$git_branch$git_status$character'

[directory]
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = '[$branch]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'yellow'
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
stashed = '$'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'
untracked = '?'
conflicted = '='

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
